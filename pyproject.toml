[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "spaced-study-planner"
version = "0.1.1"
description = "Offline exam plans, FSRS reviews, practice sessions, and local study analytics"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["fsrs>=6,<7", "PyYAML>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.16,<2", "markdown-it-py>=3,<5", "bleach>=6,<7", "matplotlib>=3.9,<4", "beautifulsoup4>=4.12,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=7,<8", "ruff>=0.11,<1", "httpx>=0.27,<1"]
[project.scripts]
ssp = "spaced_study_planner.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/spaced_study_planner"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.coverage.run]
patch = ["subprocess"]
